<?xml version="1.0" encoding="UTF-8"?>
<!--
  GroLabs WP Login — companion artifact illustrating the failure mode:
  the page renders the form in normal document flow with no sticky /
  anchored treatment, so when the on-screen keyboard appears it
  covers the LOG IN button entirely. The user has to dismiss the
  keyboard before they can submit.

  For the blog post critiquing this pattern. The covered button is
  rendered at ~14% opacity under the keyboard so the reader can see
  WHERE the button is — that's the whole point of the screenshot.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 640"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Mobile login screen showing the on-screen keyboard covering the LOG IN button. The button is faintly visible behind the keyboard, illustrating that the user cannot tap it without first dismissing the keyboard.">
  <defs>
    <linearGradient id="screenLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="318.5" height="638.5" rx="22"
        fill="url(#screenLit)"
        stroke="rgba(237,234,224,0.22)" stroke-width="1.5"/>

  <rect x="130" y="34" width="60" height="22" rx="11" fill="#000000"/>
  <circle cx="178" cy="45" r="2" fill="#1F1F23"/>

  <text x="44" y="80"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="15" font-weight="600" fill="#EDEAE0">9:41</text>
  <g transform="translate(220, 70)">
    <rect x="0"  y="6" width="3" height="4"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="5"  y="4" width="3" height="6"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="10" y="2" width="3" height="8"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="15" y="0" width="3" height="10" rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <g transform="translate(24, 0)">
      <path d="M 0 8 Q 7 0 14 8" fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 3 9 Q 7 5 11 9" fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="7" cy="10" r="1" fill="rgba(237,234,224,0.9)"/>
    </g>
    <g transform="translate(46, 1)">
      <rect x="0" y="0" width="24" height="11" rx="2.5" fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1"/>
      <rect x="25" y="3.5" width="2" height="4" rx="0.5" fill="rgba(237,234,224,0.9)"/>
      <rect x="2"  y="2"   width="18" height="7" rx="1"  fill="rgba(237,234,224,0.9)"/>
    </g>
  </g>

  <!-- Brand + title. Wordmark rendered from the canonical
       grolabs-wordmark asset (Satori-baked Permanent Marker paths). -->
  <image x="90" y="92" width="140" height="34"
         href="grolabs-wordmark.png"
         preserveAspectRatio="xMidYMid meet"/>
  <text x="160" y="156"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#EDEAE0" text-anchor="middle">Sign in</text>

  <!-- Email field (visible above keyboard) -->
  <text x="24" y="195"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="rgba(237,234,224,0.55)" letter-spacing="0.5">EMAIL</text>
  <g transform="translate(24, 202)">
    <rect width="272" height="44" rx="8" fill="#1F1F23" stroke="rgba(255,255,255,0.08)"/>
    <text x="14" y="28"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="14" fill="#EDEAE0">peter@grolabs.ai</text>
  </g>

  <!-- Password field (focused, visible above keyboard) -->
  <text x="24" y="269"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="rgba(237,234,224,0.55)" letter-spacing="0.5">PASSWORD</text>
  <g transform="translate(24, 276)">
    <rect width="272" height="44" rx="8" fill="#1F1F23" stroke="#fae194" stroke-width="1.5"/>
    <text x="14" y="28"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="20" fill="#EDEAE0" letter-spacing="2">•••••••</text>
    <line x1="105" y1="14" x2="105" y2="32" stroke="#fae194" stroke-width="1.5"/>
  </g>

  <!-- "Ghost" LOG IN button: where the button SHOULD be — covered by
       the keyboard below. Rendered at very low opacity so the reader
       can see what's hidden. The whole point of this image is to
       expose this overlap. -->
  <g transform="translate(24, 340)" opacity="0.18">
    <rect width="272" height="48" rx="8" fill="#fae194"/>
    <text x="136" y="32"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="15" font-weight="800" fill="#0e0e11" text-anchor="middle"
          letter-spacing="1.5">LOG IN</text>
  </g>

  <!-- Small annotation pointing at the hidden button -->
  <g aria-hidden="true">
    <text x="300" y="375"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="10" font-weight="600" fill="#ef4444" text-anchor="end"
          letter-spacing="1">HIDDEN</text>
  </g>

  <!-- ─── On-screen keyboard — same renderer as the anchored variant,
       only it sits higher so it overlaps the LOG IN button instead of
       sitting cleanly below it. ─── -->
  <g transform="translate(0, 332)">
    <rect x="0" y="0" width="320" height="288" fill="#1c1c1f"/>

    <!-- Suggestion bar -->
    <g transform="translate(8, 10)">
      <rect x="0"   y="0" width="98" height="28" rx="5" fill="rgba(255,255,255,0.04)"/>
      <text x="49"  y="19" font-family="system-ui" font-size="11" fill="rgba(237,234,224,0.85)" text-anchor="middle">password</text>
      <rect x="103" y="0" width="98" height="28" rx="5" fill="rgba(255,255,255,0.06)"/>
      <text x="152" y="19" font-family="system-ui" font-size="11" fill="rgba(237,234,224,0.95)" text-anchor="middle">passwords</text>
      <rect x="206" y="0" width="98" height="28" rx="5" fill="rgba(255,255,255,0.04)"/>
      <text x="255" y="19" font-family="system-ui" font-size="11" fill="rgba(237,234,224,0.85)" text-anchor="middle">passport</text>
    </g>

    <!-- Row 1: Q W E R T Y U I O P -->
    <g transform="translate(4, 50)">
      <g font-family="system-ui" font-size="14" font-weight="500" fill="#EDEAE0" text-anchor="middle">
        <g><rect x="0"   y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="14"  y="25">q</text></g>
        <g><rect x="31"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="45"  y="25">w</text></g>
        <g><rect x="62"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="76"  y="25">e</text></g>
        <g><rect x="93"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="107" y="25">r</text></g>
        <g><rect x="124" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="138" y="25">t</text></g>
        <g><rect x="155" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="169" y="25">y</text></g>
        <g><rect x="186" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="200" y="25">u</text></g>
        <g><rect x="217" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="231" y="25">i</text></g>
        <g><rect x="248" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="262" y="25">o</text></g>
        <g><rect x="279" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="293" y="25">p</text></g>
      </g>
    </g>

    <!-- Row 2: A S D F G H J K L -->
    <g transform="translate(20, 100)">
      <g font-family="system-ui" font-size="14" font-weight="500" fill="#EDEAE0" text-anchor="middle">
        <g><rect x="0"   y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="14"  y="25">a</text></g>
        <g><rect x="31"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="45"  y="25">s</text></g>
        <g><rect x="62"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="76"  y="25">d</text></g>
        <g><rect x="93"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="107" y="25">f</text></g>
        <g><rect x="124" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="138" y="25">g</text></g>
        <g><rect x="155" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="169" y="25">h</text></g>
        <g><rect x="186" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="200" y="25">j</text></g>
        <g><rect x="217" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="231" y="25">k</text></g>
        <g><rect x="248" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="262" y="25">l</text></g>
      </g>
    </g>

    <!-- Row 3: shift Z X C V B N M backspace -->
    <g transform="translate(4, 150)">
      <g font-family="system-ui" font-size="14" font-weight="500" fill="#EDEAE0" text-anchor="middle">
        <rect x="0"   y="0" width="38" height="40" rx="5" fill="#2a2a2d"/>
        <text x="19"  y="25" font-size="16">⇧</text>
        <g><rect x="46"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="60"  y="25">z</text></g>
        <g><rect x="77"  y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="91"  y="25">x</text></g>
        <g><rect x="108" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="122" y="25">c</text></g>
        <g><rect x="139" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="153" y="25">v</text></g>
        <g><rect x="170" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="184" y="25">b</text></g>
        <g><rect x="201" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="215" y="25">n</text></g>
        <g><rect x="232" y="0" width="28" height="40" rx="5" fill="#3a3a3f"/><text x="246" y="25">m</text></g>
        <rect x="270" y="0" width="38" height="40" rx="5" fill="#2a2a2d"/>
        <text x="289" y="25" font-size="16">⌫</text>
      </g>
    </g>

    <!-- Row 4: 123 emoji space return -->
    <g transform="translate(4, 200)">
      <g font-family="system-ui" font-size="13" font-weight="500" fill="#EDEAE0" text-anchor="middle">
        <rect x="0"   y="0" width="40" height="40" rx="5" fill="#2a2a2d"/>
        <text x="20"  y="25">123</text>
        <rect x="43"  y="0" width="32" height="40" rx="5" fill="#2a2a2d"/>
        <text x="59"  y="26" font-size="16">☺</text>
        <rect x="78"  y="0" width="158" height="40" rx="5" fill="#3a3a3f"/>
        <text x="157" y="25" font-size="12">space</text>
        <rect x="239" y="0" width="69" height="40" rx="5" fill="#fae194"/>
        <text x="273" y="25" font-size="12" fill="#0e0e11" font-weight="700">go</text>
      </g>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="125" y="624" width="70" height="5" rx="2.5" fill="rgba(237,234,224,0.45)"/>
</svg>
