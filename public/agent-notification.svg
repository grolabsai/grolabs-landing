<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flat notification panel mockup — the "agent texts you when something
  matters" metaphor, paired stylistically with grow-dashboard.svg.

  No realistic phone chrome (no dynamic island, no status bar, no time
  display, no home indicator) — the user feedback was that the dashboard
  SVG's flat, wireframe-y treatment is the house style, so the phone
  follows the same recipe: a thin light-gray border around a notification
  card, full bleed within the viewBox so any band placed above/below it
  in the layout matches the asset's width edge-to-edge.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 280"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="A push notification from GroLabs: 'Hello Peter, I'm afraid traffic dropped 6% yesterday.' with a More info link.">

  <!-- Outer screen frame: flat dark surface + light gray hairline border. -->
  <rect x="0.75" y="0.75" width="358.5" height="278.5" rx="14"
        fill="#131316"
        stroke="rgba(237,234,224,0.22)" stroke-width="1.5"/>

  <!-- Notification card centered inside the frame. -->
  <g transform="translate(28, 48)">
    <rect x="0" y="0" width="304" height="184" rx="16"
          fill="#1F1F23"
          stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- App icon: yellow rounded square with a marker-style G. -->
    <rect x="20" y="20" width="34" height="34" rx="9" fill="#fae194"/>
    <text x="37" y="46"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="22" font-weight="800" fill="#0e0e11" text-anchor="middle">G</text>

    <!-- Sender + timestamp -->
    <text x="66" y="34"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#EDEAE0">GroLabs</text>
    <text x="284" y="34"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="12" fill="rgba(237,234,224,0.5)" text-anchor="end">now</text>

    <!-- Subtitle -->
    <text x="66" y="50"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="12" fill="rgba(237,234,224,0.55)">Traffic alert</text>

    <!-- Divider -->
    <line x1="20" y1="76" x2="284" y2="76"
          stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Message body (two hand-broken lines so the wrap reads cleanly) -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="14" fill="#EDEAE0" font-weight="400">
      <tspan x="20" y="106">Hello Peter, I'm afraid</tspan>
      <tspan x="20" y="128">traffic dropped 6% yesterday.</tspan>
    </text>

    <!-- More info link, primary yellow -->
    <text x="20" y="160"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#fae194">More info ›</text>
  </g>
</svg>
