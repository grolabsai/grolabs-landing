<?xml version="1.0" encoding="UTF-8"?>
<!--
  Phone mockup with a single push notification from GroLabs.

  Metaphor: the agent watches your dashboards so you don't have to.
  When something matters, it taps you on the shoulder — exactly once,
  in plain language, with a way to drill down.

  Palette locked to landing tokens (canvas-deeper / canvas / #1F1F23
  / primary yellow / bone). Standalone asset — drop into decks,
  social cards, etc.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 640"
     role="img"
     aria-label="A smartphone showing a single push notification from GroLabs: 'Hello Peter, I'm afraid traffic dropped 6% yesterday.' with a More info link.">
  <defs>
    <!-- Soft yellow glow behind the phone — same ambient treatment as
         the dashboard SVG so the two assets feel paired. -->
    <radialGradient id="phoneAmbient" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#fae194" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#fae194" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#fae194" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner sheen along the top of the phone body. -->
    <linearGradient id="bezelSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Faint inner gradient on the screen so it reads as "lit". -->
    <linearGradient id="screenLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1a1f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#131316" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Ambient halo -->
  <rect x="0" y="0" width="320" height="640" fill="url(#phoneAmbient)"/>

  <!-- Phone outer body -->
  <rect x="10" y="10" width="300" height="620" rx="44"
        fill="#0e0e11"
        stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Top sheen on the bezel -->
  <rect x="10" y="10" width="300" height="40" rx="44" fill="url(#bezelSheen)"/>

  <!-- Screen -->
  <rect x="20" y="20" width="280" height="600" rx="36"
        fill="url(#screenLit)"/>

  <!-- Dynamic-island camera pill -->
  <rect x="130" y="34" width="60" height="22" rx="11" fill="#000000"/>
  <circle cx="178" cy="45" r="2" fill="#1F1F23"/>

  <!-- Status bar (left: time / right: signal · wifi · battery) -->
  <text x="44" y="80"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="600" fill="#EDEAE0">9:41</text>

  <g transform="translate(220, 70)">
    <!-- Signal bars -->
    <rect x="0"  y="6" width="3" height="4"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="5"  y="4" width="3" height="6"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="10" y="2" width="3" height="8"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="15" y="0" width="3" height="10" rx="0.5" fill="rgba(237,234,224,0.9)"/>

    <!-- Wi-Fi arcs + dot -->
    <g transform="translate(24, 0)">
      <path d="M 0 8 Q 7 0 14 8" fill="none"
            stroke="rgba(237,234,224,0.9)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 3 9 Q 7 5 11 9" fill="none"
            stroke="rgba(237,234,224,0.9)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="7" cy="10" r="1" fill="rgba(237,234,224,0.9)"/>
    </g>

    <!-- Battery -->
    <g transform="translate(46, 1)">
      <rect x="0" y="0" width="24" height="11" rx="2.5"
            fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1"/>
      <rect x="25" y="3.5" width="2" height="4" rx="0.5" fill="rgba(237,234,224,0.9)"/>
      <rect x="2"  y="2"   width="18" height="7" rx="1"  fill="rgba(237,234,224,0.9)"/>
    </g>
  </g>

  <!-- Big lock-screen time + date so the screen reads as "real" -->
  <text x="160" y="160"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="60" font-weight="200" fill="#EDEAE0" text-anchor="middle"
        letter-spacing="-2">9:41</text>
  <text x="160" y="190"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="13" font-weight="500" fill="rgba(237,234,224,0.55)" text-anchor="middle"
        letter-spacing="0.5">Tuesday, May 27</text>

  <!-- Notification card -->
  <g>
    <!-- Card body -->
    <rect x="36" y="240" width="248" height="148" rx="18"
          fill="#1F1F23"
          stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- App icon — yellow rounded square with a marker-style G -->
    <rect x="52" y="256" width="28" height="28" rx="7" fill="#fae194"/>
    <text x="66" y="278"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="18" font-weight="800" fill="#0e0e11" text-anchor="middle">G</text>

    <!-- Sender + timestamp row -->
    <text x="90" y="268"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#EDEAE0">GroLabs</text>
    <text x="268" y="268"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="11" fill="rgba(237,234,224,0.5)" text-anchor="end">now</text>

    <!-- Subtitle -->
    <text x="90" y="282"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="11" fill="rgba(237,234,224,0.55)">Traffic alert</text>

    <!-- Divider -->
    <line x1="52" y1="300" x2="268" y2="300"
          stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Message body — two lines, hand-broken so the line balance reads well -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="13" fill="#EDEAE0" font-weight="400">
      <tspan x="52" y="324">Hello Peter, I'm afraid</tspan>
      <tspan x="52" y="342">traffic dropped 6% yesterday.</tspan>
    </text>

    <!-- More info link, primary yellow -->
    <text x="52" y="372"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#fae194">More info ›</text>
  </g>

  <!-- Home indicator -->
  <rect x="125" y="600" width="70" height="5" rx="2.5" fill="rgba(237,234,224,0.45)"/>
</svg>
