<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Revenue Recovery Engine — scroll-driven</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />
<style>
  /* Scroll-driven Revenue Recovery Engine: every visual is a pure function
     of a progress value p (0→1) posted by the parent as {type:'rre-p', p},
     so scrolling up rewinds the run exactly.

     Two clearly separated zones:
     · .shop — the LIGHT storefront card: what the shopper sees and does
       (search term types in → search button clicks → red "no results").
     · the DARK panels — the GroLabs engine reacting automatically
       (leak captured → proposed fix → recovered revenue).
     All three emulated searches return no results: a typo, a missing
     synonym, and a semantic query the catalog has no description for. */
  :root{
    --gold:#fae194; --blue:#9ec5ff; --pass:#34d399;
    --leak:#f0a3a3; --leak-s:#ef4444; --surface:#1a1b22; --bone:#EDEAE0;
    --mono:ui-monospace,Menlo,monospace; --sans:"Hanken Grotesk",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:transparent;
    font-family:var(--sans); color:var(--bone); padding:8px; overflow:hidden;
    height:100svh; display:grid; place-items:start center;
  }
  /* left padding = a reserved gutter where the yellow guide line runs, so
     it sits BESIDE the blocks instead of crossing over them */
  .m-wrap{max-width:488px; width:100%; margin:0 auto; padding-left:28px; transform:translateX(-14px); display:flex; flex-direction:column; gap:8px; position:relative;}
  #guide{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; z-index:60; opacity:0;}
  #guide path{fill:none; stroke:#f5c518; stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke;}
  #guidePath{filter:drop-shadow(0 2px 6px rgba(245,197,24,.3));}
  #guideHead{opacity:0;}
  /* progressive-reveal groups: space is always reserved (no reflow); the
     blocks fade in only when the story first needs them */
  .rev{display:flex; flex-direction:column; gap:8px;}

  /* zone separators */
  .z-lab{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(237,234,224,.5); transition:filter .5s ease, opacity .5s ease;}
  .z-lab::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(255,255,255,.16),transparent);}

  /* ── storefront (shopper's screen — light UI) ── */
  .shop{background:#f6f6f4; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14); overflow:hidden; transition:filter .5s ease, opacity .5s ease;}
  .shop-bar{display:flex; align-items:center; gap:5px; padding:7px 11px; background:#ececeb; border-bottom:1px solid #dddddb;}
  .shop-dot{width:8px; height:8px; border-radius:99px;}
  .shop-dot.r{background:#f87171;} .shop-dot.y{background:#fbbf24;} .shop-dot.g{background:#34d399;}
  .shop-url{margin-left:7px; font-family:var(--mono); font-size:11.5px; color:#8a8a90; background:#fff; border:1px solid #dddddb; border-radius:5px; padding:2px 8px;}
  .shop-body{padding:12px;}
  .shop-search{display:flex; gap:7px;}
  /* no box-shadow/border transition: the post-payout double blink is
     driven per scroll tick and must not be smeared by easing */
  .shop-q{flex:1; display:flex; align-items:center; gap:2px; background:#fff; border:1.5px solid #d6d6d3; border-radius:9px; padding:9px 12px; font-size:16px; color:#1b1c22; min-height:39px;}
  .shop-q.live{border-color:#a8a8a4; box-shadow:0 0 0 3px rgba(27,28,34,.05);}
  .shop-q .ph{color:#a3a3a0;}
  .shop-caret{display:inline-block; width:1.5px; height:15px; background:#1b1c22; animation:blink 1s steps(1) infinite;}
  @keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
  .shop-btn{flex:none; width:41px; border:0; border-radius:9px; background:#1b1c22; color:#fff; display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.25);}
  /* no-results strip — space reserved from the start so nothing reflows */
  /* one short centered line ("No results") at the search box's font
     size, with an ! icon — the box height stays constant */
  .shop-res{margin-top:9px; min-height:42px; border-radius:8px; border:1px solid transparent; display:flex; align-items:center; justify-content:center; gap:9px; padding:8px 12px; font-size:16px; font-weight:600; color:transparent; transition:background .25s, border-color .25s, color .25s;}
  .shop-res.bad{background:rgba(239,68,68,.09); border-color:rgba(239,68,68,.4); color:#b91c1c;}
  .shop-res .ic{width:20px; height:20px; border-radius:99px; background:transparent; color:transparent; font-weight:800; font-size:13px; line-height:1; display:grid; place-items:center; flex:none;}
  .shop-res.bad .ic{background:#dc2626; color:#fff;}

  /* ── engine panels (dark) ── */
  .m-panel{background:var(--surface); border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:11px 12px; box-shadow:0 10px 22px rgba(0,0,0,.5); display:flex; flex-direction:column; transition:filter .5s ease, opacity .5s ease;}
  .m-wrap.ended :is(.m-pipe,.shop,.z-lab){ filter:grayscale(1); opacity:.45; }
  .m-h{font-family:var(--mono); font-size:12.5px; letter-spacing:.16em; text-transform:uppercase;}
  .m-h .s{display:block; font-size:11px; letter-spacing:.03em; color:rgba(237,234,224,.4); margin-top:3px; text-transform:none;}
  .green{color:var(--pass);} .gold{color:var(--gold);} .blue{color:var(--blue);} .red{color:var(--leak);} .white{color:var(--bone);}

  /* pipeline — leak stays on the LEFT, the proposed fix appears beside
     it on the RIGHT (it does not replace the leak) */
  .m-pipe{min-height:96px; display:flex; flex-direction:column; gap:7px; padding:10px 11px;}
  .m-lab{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(237,234,224,.5);}
  .m-lab::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.12);}
  .m-prob{font-size:22px; line-height:1.3; color:rgba(237,234,224,.6); min-height:17px; margin:2px 0 4px;}
  .m-pipe.idle{opacity:.5;}
  .m-pipe-col{position:relative; border:1px solid rgba(255,255,255,.10); border-radius:9px; padding:9px 10px; display:flex; flex-direction:column; transition:border-color .25s, background .25s;}
  .m-pipe-col .m-pipe-tag{position:absolute; top:8px; right:8px; margin:0;}
  .m-pipe-col .m-pipe-item{padding-right:132px;}
  .m-pipe-col .m-h{font-size:11.5px;}
  .m-pipe-col.leak.on{border-color:var(--leak-s); background:rgba(239,68,68,.05);}
  .m-pipe-col.leak.hitp{box-shadow:0 0 0 1px rgba(239,68,68,.55),0 0 20px rgba(239,68,68,.25);}
  /* once the fix appears, the leak steps back so attention moves right */
  .m-pipe-col.leak.dim{opacity:.32; filter:grayscale(.6); transition:opacity .3s, filter .3s;}
  .m-pipe-col.fix{border-style:dashed; border-color:rgba(255,255,255,.13);}
  .m-pipe-col.fix>*{opacity:0; transition:opacity .25s;}
  .m-pipe-col.fix.on{border-style:solid;}
  .m-pipe-col.fix.on>*{opacity:1;}
  .m-pipe-col.fix.on.search{border-color:rgba(250,225,148,.55); background:rgba(250,225,148,.05);}
  .m-pipe-col.fix.on.catalog{border-color:rgba(158,197,255,.55); background:rgba(158,197,255,.05);}
  .m-pipe-item{font-size:14.5px; font-weight:600; margin:5px 0 5px; min-height:17px; overflow-wrap:anywhere;}
  .m-pipe-act{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:rgba(237,234,224,.5); margin-bottom:2px; min-height:10px;}
  .m-pipe-tag{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:6px; border:1px solid; opacity:0; transition:opacity .25s;}
  .m-pipe-tag.show{opacity:1;}
  .m-pipe-tag.leak{color:var(--leak); border-color:rgba(239,68,68,.5); background:rgba(239,68,68,.08);}
  .m-pipe-tag.search{color:var(--gold); border-color:rgba(250,225,148,.5); background:rgba(250,225,148,.1);}
  .m-pipe-tag.catalog{color:var(--blue); border-color:rgba(158,197,255,.5); background:rgba(158,197,255,.1);}

  /* recovery */
  .m-legend{display:flex; gap:12px; margin:7px 0 2px;}
  .m-legend span{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:rgba(237,234,224,.55);}
  .m-sw{width:8px;height:8px;border-radius:2px;} .m-sw.search{background:var(--gold);} .m-sw.catalog{background:var(--blue);}
  .m-table{display:flex; flex-direction:column;}
  .m-row{display:grid; grid-template-columns:18px 1fr auto auto; gap:8px; align-items:center; padding:6px 2px; border-bottom:1px solid rgba(255,255,255,.06); overflow:hidden;}
  .m-row:last-child{border-bottom:0;}
  /* fix-type icon: yellow magnifier = search fix, blue document = catalog fix */
  .m-row .ricon{display:grid; place-items:center;}
  .m-row .nm{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13.5px; font-weight:600;}
  .m-row .sl{font-family:var(--mono); font-size:11.5px; color:var(--pass); text-align:right;}
  .m-row .mo{font-family:var(--mono); font-size:13.5px; font-weight:600; text-align:right; min-width:52px;}
  .m-row.reserved{outline:1px dashed rgba(255,255,255,.12); outline-offset:-2px; border-radius:6px;}
  .m-row.reserved .ricon{opacity:.25;} .m-row.reserved .nm,.m-row.reserved .sl,.m-row.reserved .mo{opacity:0;}
  .m-row .nm,.m-row .sl,.m-row .mo{transition:opacity .25s;}

  .m-total{border-top:1px solid rgba(255,255,255,.1); margin-top:8px; padding-top:9px; display:flex; align-items:flex-end; gap:14px;}
  .m-spark{flex:1 1 auto; min-width:0; align-self:stretch; display:flex; align-items:flex-end;}
  .m-spark svg{display:block; width:100%; max-width:150px; height:44px;}
  .m-spark path{fill:none; stroke:var(--pass); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke;}
  /* light gray XY axis behind the green line */
  .m-spark .sax{stroke:rgba(255,255,255,.28); stroke-width:1.5;}
  .m-total-txt{flex:0 0 auto; text-align:right;}
  .m-total-lab{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--pass);}
  .m-total-val{font-family:"Permanent Marker",cursive; font-size:29px; line-height:1; color:var(--pass); margin:5px 0 3px;}
  .m-total-val .u{font-size:.42em; opacity:.65;}
  .m-total-sub{font-family:var(--mono); font-size:11.5px; color:rgba(237,234,224,.55);}
  .m-total-sub b{color:var(--pass);}
  .m-recovery.done{border-color:rgba(52,211,153,.45); box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1px rgba(52,211,153,.22),0 0 30px rgba(52,211,153,.12);}

  #mFlyer{position:fixed; left:0; top:0; z-index:90; pointer-events:none; opacity:0; font-family:var(--mono); font-size:10px; font-weight:600; padding:5px 9px; border-radius:7px; border:1px solid; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.5); transform-origin:center;}
</style>
</head>
<body>
<div class="m-wrap" id="mWrap">

  <div class="z-lab">Your storefront · the shopper's screen</div>
  <div class="shop">
    <div class="shop-bar"><span class="shop-dot r"></span><span class="shop-dot y"></span><span class="shop-dot g"></span><span class="shop-url">yourstore.com</span></div>
    <div class="shop-body">
      <div class="shop-search">
        <div class="shop-q" id="shopQ"><span id="qText" class="ph">Search products…</span><span class="shop-caret" id="qCaret" style="display:none"></span></div>
        <button class="shop-btn" id="shopBtn" type="button" tabindex="-1" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
      <div class="shop-res" id="shopRes"><span class="ic">!</span><span id="resTxt"></span></div>
    </div>
  </div>

  <div class="rev" id="revSys">
  <div class="m-panel m-pipe idle" id="mPipe">
    <div class="m-lab">Diagnosis</div>
    <div class="m-pipe-col leak" id="pLeak">
      <div class="m-pipe-item" id="leakItem">awaiting searches</div>
      <div class="m-prob" id="leakProb"></div>
      <div class="m-pipe-tag" id="leakTag">idle</div>
    </div>
    <div class="m-lab">Fix</div>
    <div class="m-pipe-col fix" id="pFix">
      <div class="m-pipe-act" id="fixAct"></div>
      <div class="m-pipe-item" id="fixItem"></div>
      <div class="m-pipe-tag" id="fixTag"></div>
    </div>
  </div>
  </div>

  <div class="rev" id="revRec">
  <div class="m-panel m-recovery" id="mRecovery">
    <div class="m-h green">Recovery Monitor</div>
    <div class="m-table" id="mTable"></div>
    <div class="m-total">
      <!-- sparkline draws left→right, bottom→top, advancing only while
           the number grows (one bump per fix) -->
      <div class="m-spark">
        <svg viewBox="0 0 120 44" preserveAspectRatio="none" aria-hidden="true">
          <path class="sax" d="M2 2 L2 42 L118 42" />
          <path id="mSpark" style="stroke-dasharray:0 400" d="M2 42 C8 42 12 41 16 40 C26 37 32 34 36 32 L44 31 C54 28 62 23 70 20 L80 18 C90 15 100 11 108 8 L116 6" />
        </svg>
      </div>
      <div class="m-total-txt">
        <div class="m-total-lab">Revenue recovered</div>
        <div class="m-total-val" id="mRev">$0<span class="u"> /mo</span></div>
        <div class="m-total-sub"><span id="mLeaks">0</span> <span id="mLeaksLab">leaks</span> fixed · <b>+<span id="mSales">0</span> sales</b></div>
      </div>
    </div>
  </div>
  </div>

  <!-- hand-drawn guide line: after each payout it sweeps from the updated
       total up the left side to the search box; erased tail-first when the
       next search starts typing -->
  <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path id="guidePath" d="M 79 96.5 C 55 103.5,13 101,4.6 89 C 1 80.5,1.2 42,2.6 16.5 C 2.9 11,5.2 8.4,10 9.1" />
    <path id="guideHead" d="M 10 9.1 L 7 11.7 M 10 9.1 L 7.1 6.8" />
  </svg>
</div>
<div id="mFlyer"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const money = n => '$'+Math.round(n).toLocaleString();
  const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
  const ease = k => 1-Math.pow(1-k,3);
  const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);

  /* Three no-result searches: a typo, a missing synonym, and a semantic
     query the catalog has no description to match. */
  const EVENTS=[
    {item:'snekers', type:'search', act:'Set typo tolerance', detail:'snekers → Sneakers', tag:'Search engine',
     problem:'Likely a typo of “sneakers” — typo tolerance is off.',
     row:{type:'search', nm:'snekers → sneakers', sl:41, mo:3260}},
    {item:'trainers', type:'search', act:'Create synonym', detail:'trainers = running shoes', tag:'Search engine',
     problem:'Catalog calls these “running shoes” — no synonym for “trainers”.',
     row:{type:'search', nm:'trainers → running shoes', sl:64, mo:6080}},
    {item:'shoes for standing all day', type:'catalog', act:'Add product description', detail:'Cloudfoam + “all-day support”', tag:'Data enrichment',
     problem:'Intent query — the products have no descriptions to match it.',
     row:{type:'catalog', nm:'standing all day · description', sl:38, mo:4370}},
  ];
  const COL={ search:{bg:'rgba(250,225,148,.16)',fg:'#fae194',bd:'rgba(250,225,148,.6)'},
              catalog:{bg:'rgba(158,197,255,.16)',fg:'#9ec5ff',bd:'rgba(158,197,255,.6)'},
              leak:{bg:'rgba(254,242,242,.97)',fg:'#b91c1c',bd:'rgba(239,68,68,.6)'} };

  /* progress map: intro, 3 equal event segments, finale */
  const INTRO=0.03, FINALE=0.92, W=(FINALE-INTRO)/EVENTS.length;
  /* phases inside one event (local t 0..1):
     type → CLICK → no-results → leak flies to engine → leak card →
     proposed fix → fix flies to its row → totals roll */
  const PH={ typeEnd:0.13, click:[0.15,0.21], res:0.21,
             fly1:[0.27,0.38], leakEnd:0.52, fixEnd:0.66,
             fly2:[0.66,0.78], roll:[0.78,0.90], blink:[0.92,1.0] };

  // build the reserved recovery rows up front
  const rowEls = EVENTS.map(ev=>{
    const el=document.createElement('div'); el.className='m-row reserved '+ev.row.type;
    const IC=ev.row.type==='search'
      ?'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fae194" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'
      :'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#9ec5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>';
    el.innerHTML='<span class="ricon">'+IC+'</span><span class="nm">'+ev.row.nm+'</span><span class="sl">+0</span><span class="mo">$0</span>';
    $('#mTable').appendChild(el); return el;
  });

  let GLEN=250, SLEN=140;
  try{ GLEN=document.getElementById('guidePath').getTotalLength(); }catch(e){}
  try{ SLEN=document.getElementById('mSpark').getTotalLength(); }catch(e){}
  const TOTREV=EVENTS.reduce((a,e)=>a+e.row.mo,0);

  /* The pipeline card must NOT resize with its content (that would push
     the Recovery Monitor up and down): measure the tallest leak/fix
     state across every event and lock the card to that height. */
  function lockPipeHeight(){
    const pipe=$('#mPipe');
    pipe.style.minHeight='';
    let max=0;
    EVENTS.forEach(ev=>{
      setPipe('leak',ev); max=Math.max(max,pipe.offsetHeight);
      setPipe('fix',ev);  max=Math.max(max,pipe.offsetHeight);
    });
    setPipe('idle',EVENTS[0]);
    pipe.style.minHeight=max+'px';
  }

  let zoom=1;
  function fit(){
    document.body.style.zoom='1';
    lockPipeHeight();
    const need=$('#mWrap').offsetHeight+16;
    zoom=Math.max(0.55,Math.min(1,innerHeight/need));
    document.body.style.zoom=zoom<0.999?String(zoom.toFixed(3)):'1';
    // wrapping differs at the applied zoom — re-lock in the final space
    if(zoom<0.999) lockPipeHeight();
  }
  function center(el){ const r=el.getBoundingClientRect(); return {x:(r.left+r.width/2)/zoom, y:(r.top+r.height/2)/zoom}; }

  function setPipe(state,ev){
    // left column: the leak — stays visible while the fix shows on the right
    const leakOn=state!=='idle';
    $('#mPipe').className='m-panel m-pipe'+(state==='idle'?' idle':'');
    $('#pLeak').className='m-pipe-col leak'+(leakOn?' on':'')+(state==='hit'?' hitp':'')+(state==='fix'?' dim':'');
    $('#leakItem').textContent=leakOn?'"'+ev.item+'"':'awaiting searches';
    $('#leakProb').textContent=leakOn?ev.problem:'';
    $('#leakTag').className='m-pipe-tag'+(leakOn?' show leak':'');
    $('#leakTag').textContent=leakOn?'Revenue leak':'idle';
    // right column: the proposed fix
    const fixOn=state==='fix';
    $('#pFix').className='m-pipe-col fix'+(fixOn?' on '+ev.type:'');
    $('#fixAct').textContent=fixOn?ev.act:'';
    $('#fixItem').textContent=fixOn?ev.detail:'';
    var TAGIC={search:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
               catalog:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>'};
    $('#fixTag').className='m-pipe-tag'+(fixOn?' show '+ev.type:'');
    $('#fixTag').innerHTML=fixOn?TAGIC[ev.type]+'<span>'+ev.tag+'</span>':'';
  }

  function setFlyer(on,from,to,k,color,text){
    const f=$('#mFlyer');
    if(!on){ f.style.opacity='0'; return; }
    const e=ease(k), x=from.x+(to.x-from.x)*e, y=from.y+(to.y-from.y)*e;
    f.textContent=text; f.style.background=color.bg; f.style.color=color.fg; f.style.borderColor=color.bd;
    f.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%) scale('+(0.85+0.15*e)+')';
    f.style.opacity=String(k<0.08?k/0.08:k>0.92?(1-k)/0.08:1);
  }

  function render(P){
    P=clamp(P,0,1);
    const t=clamp((P-INTRO)/(FINALE-INTRO),0,1)*EVENTS.length;
    const i=Math.min(EVENTS.length-1,Math.floor(t));  // active event
    const lt=P<INTRO?0:clamp(t-i,0,1);                // local t in the event
    const ev=EVENTS[i];
    const started=P>=INTRO;

    /* progressive reveal (global P): only the storefront is visible at
       first; the engine appears as the first leak flies down, the
       Recovery Monitor just before the first fix lands in it */
    const W1=(FINALE-INTRO)/EVENTS.length;
    const sysRev=ease(seg(P,INTRO+W1*0.20,INTRO+W1*0.27));
    const recRev=ease(seg(P,INTRO+W1*0.56,INTRO+W1*0.64));
    [['#revSys',sysRev],['#revRec',recRev]].forEach(([sel,v])=>{
      const el=$(sel);
      el.style.opacity=v.toFixed(3);
      // enter from ABOVE (slide down): the reveal follows the eye path
      el.style.transform=v<1?'translateY('+(-(1-v)*10).toFixed(1)+'px)':'';
      el.style.visibility=v<=0?'hidden':'';
    });

    /* 1 · storefront: the query types in */
    const chars=Math.round(ev.item.length*seg(lt,0,PH.typeEnd));
    const typing=started&&chars>0;
    const qT=$('#qText');
    if(typing){ qT.textContent=ev.item.slice(0,chars); qT.className=''; }
    else { qT.textContent='Search products…'; qT.className='ph'; }
    $('#qCaret').style.display=typing&&lt<PH.res?'':'none';
    const qBox=$('#shopQ');
    qBox.classList.toggle('live',typing&&lt<PH.click[1]);

    /* after the payout lands, the search box blinks twice (gold) to
       lead the eye back up before the next search — not after the last */
    const nb=started&&i<EVENTS.length-1?seg(lt,PH.blink[0],PH.blink[1]):0;
    const pulse=nb>0&&nb<1?Math.max(0,Math.sin(4*Math.PI*nb)):0;   // two humps
    qBox.style.borderColor=pulse>0.02?'rgba(245,183,0,'+(0.35+0.65*pulse).toFixed(2)+')':'';
    qBox.style.boxShadow=pulse>0.02?'0 0 0 '+(4.5*pulse).toFixed(1)+'px rgba(245,183,0,'+(0.4*pulse).toFixed(2)+')':'';

    /* 2 · the search "click" — button press effect */
    const ck=seg(lt,PH.click[0],PH.click[1]);
    const press=started&&ck>0&&ck<1?Math.sin(Math.PI*ck):0;
    const btn=$('#shopBtn');
    btn.style.transform='scale('+(1-0.16*press).toFixed(3)+')';
    btn.style.filter=press>0?'brightness('+(1+press*0.9).toFixed(2)+')':'';
    btn.style.boxShadow=press>0?'0 0 0 '+(press*5).toFixed(1)+'px rgba(27,28,34,.14)':'';

    /* 3 · the reaction: red no-results strip. It clears the moment the
       leak chip finishes carrying it down to the Revenue-leak card, so
       the storefront is clean for the next run */
    const resOn=started&&lt>=PH.res&&lt<PH.fly1[1];
    $('#shopRes').classList.toggle('bad',resOn);
    $('#resTxt').textContent=resOn?'No results':'';

    /* engine: pipeline card state */
    if(!started||lt<PH.fly1[1]) setPipe('idle',ev);
    else if(lt<PH.leakEnd)      setPipe(lt<PH.fly1[1]+0.06?'hit':'leak',ev);
    else if(lt<PH.fly2[1])      setPipe('fix',ev);
    else                        setPipe('idle',ev);

    /* flyer (at most one flight active) */
    if(started&&lt>=PH.fly1[0]&&lt<PH.fly1[1]){
      setFlyer(true,center($('#shopRes')),center($('#pLeak')),seg(lt,PH.fly1[0],PH.fly1[1]),COL.leak,'✕ 0 results · "'+ev.item+'"');
    } else if(started&&lt>=PH.fly2[0]&&lt<PH.fly2[1]){
      setFlyer(true,center($('#pFix')),center(rowEls[i]),seg(lt,PH.fly2[0],PH.fly2[1]),ev.type==='catalog'?COL.catalog:COL.search,ev.row.nm);
    } else setFlyer(false);

    /* rows + totals: earlier events full, active event rolls, later reserved */
    let rev=0,sales=0,leaks=0;
    EVENTS.forEach((e2,j)=>{
      const f=j<i?1:j>i?0:(started?ease(seg(lt,PH.roll[0],PH.roll[1])):0);
      const revealed=j<i||(j===i&&started&&lt>=PH.fly2[1]);
      rowEls[j].classList.toggle('reserved',!revealed);
      rowEls[j].querySelector('.sl').textContent='+'+Math.round(e2.row.sl*f);
      rowEls[j].querySelector('.mo').textContent=money(e2.row.mo*f);
      rev+=e2.row.mo*f; sales+=e2.row.sl*f; if(revealed)leaks++;
    });
    $('#mRev').innerHTML=money(rev)+'<span class="u"> /mo</span>';
    $('#mSales').textContent=Math.round(sales); $('#mLeaks').textContent=leaks;
    $('#mLeaksLab').textContent=leaks===1?'leak':'leaks';

    /* sparkline beside the number: drawn length follows the recovered
       total, so it only advances while the number is growing */
    const sf=SLEN*(TOTREV?rev/TOTREV:0);
    $('#mSpark').style.strokeDasharray=sf.toFixed(2)+' '+(SLEN+2).toFixed(2);

    /* guide line: drawn from the fresh payout up to the search box during
       the blink window, then fades out as soon as the draw finishes.
       Both transitions. */
    let gDraw=0,gFade=0,gOn=false;
    for(let k=0;k<EVENTS.length-1;k++){
      const dr=ease(seg(P,INTRO+W1*(k+0.92),INTRO+W1*(k+1)));
      const fd=ease(seg(P,INTRO+W1*(k+1.03),INTRO+W1*(k+1.12)));
      if(dr>0&&fd<1){ gDraw=dr; gFade=fd; gOn=true; break; }
    }
    const gp=$('#guidePath');
    if(gOn){
      gp.style.strokeDasharray=(GLEN*gDraw).toFixed(2)+' '+(GLEN*2).toFixed(2);
      gp.style.strokeDashoffset='0';
      $('#guide').style.opacity=(1-gFade).toFixed(3);
      $('#guideHead').style.opacity=seg(gDraw,0.9,1).toFixed(3);
    } else $('#guide').style.opacity='0';

    /* finale: recovery panel locks green, rest greys out */
    $('#mRecovery').classList.toggle('done',P>0.97);
    $('#mWrap').classList.toggle('ended',P>0.985);
  }

  let last=0;
  addEventListener('message',e=>{
    if(e&&e.data&&e.data.type==='rre-p'&&typeof e.data.p==='number'){ last=e.data.p; render(last); }
  });
  addEventListener('resize',()=>{ fit(); render(last); });
  addEventListener('load',()=>{ fit(); render(0); });
})();
</script>
</body>
</html>
