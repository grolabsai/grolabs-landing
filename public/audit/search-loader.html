<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search results audit loader — GroLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />
<style>
  :root {
    --scout-accent: #fae194;
    --scout-accent-on: #131316;
    --s-bg: #131316;
    --s-bg-deeper: #0E0E11;
    --s-surface: #1c1d24;
    --s-surface-alt: #16171c;
    --s-surface-hover: #24262e;
    --s-border: rgba(255,255,255,0.08);
    --s-border-strong: rgba(255,255,255,0.16);
    --s-text: #EDEAE0;
    --s-text-strong: #FFFFFF;
    --s-text-secondary: rgba(237,234,224,0.6);
    --s-text-tertiary: rgba(237,234,224,0.4);
    --s-text-muted: rgba(237,234,224,0.28);
    --s-pass: #34d399;
    --s-fail: #f87171;
    --s-radius-sm: 6px;
    --s-radius-md: 8px;
    --s-radius-lg: 12px;
    --s-font: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    --s-font-brand: "Permanent Marker", cursive;
    --s-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; font-family: var(--s-font); overflow: hidden; }

  /* Pin to the TOP (align-items: flex-start). When this landscape canvas sits
     in a taller (near-square) container it scales to width and the black stage
     fills the remaining height below — looks like a normal screenshot. */
  #stage { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: #000; }
  #frame {
    width: 880px; height: 600px;
    flex-shrink: 0;
    transform-origin: top center;
    background: var(--s-bg-deeper);
    border-radius: 0;
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ─── Browser chrome ─────────────────────────────────────────────── */
  .chrome { height: 50px; flex-shrink: 0; background: var(--s-bg); border-bottom: 1px solid var(--s-border); display: flex; align-items: center; gap: 14px; padding: 0 18px; }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--s-surface-hover); display: block; }
  .navbtns { display: flex; gap: 14px; color: var(--s-text-muted); }
  .navbtns svg { width: 16px; height: 16px; }
  .addresspill { flex: 1; height: 30px; background: var(--s-surface-alt); border: 1px solid var(--s-border); border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 14px; min-width: 0; }
  .addresspill .lock { width: 11px; height: 11px; flex-shrink: 0; color: var(--s-text-tertiary); }
  .addresspill .favicon { width: 15px; height: 15px; border-radius: 3px; flex-shrink: 0; display: none; object-fit: contain; }
  .addresspill .url { font-family: var(--s-font-mono); font-size: 12px; color: var(--scout-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .addresspill .reload { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--s-text-tertiary); flex-shrink: 0; }
  .hud { display: flex; align-items: center; gap: 9px; font-family: var(--s-font-mono); font-size: 11px; color: var(--s-text-secondary); white-space: nowrap; }
  .hud .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(250,225,148,0.25); border-top-color: var(--scout-accent); animation: spin 0.85s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hud .done-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--s-pass); }
  .hud b { color: var(--s-text-strong); font-weight: 600; }
  .hud .ok { color: var(--s-pass); }
  .hud .bad { color: var(--s-fail); }

  /* ─── Page viewport ──────────────────────────────────────────────── */
  .viewport { flex: 1; min-height: 0; background: var(--s-bg-deeper); display: flex; justify-content: center; padding: 24px 30px; position: relative; overflow: hidden; }
  .page { width: 820px; display: flex; flex-direction: column; gap: 18px; }

  /* ─── Scanning light beam ────────────────────────────────────────── */
  .scanbeam {
    position: absolute; left: 0; right: 0; top: 0;
    height: 90px; pointer-events: none; z-index: 60;
    background: linear-gradient(to bottom, rgba(250,225,148,0) 0%, rgba(250,225,148,0.04) 45%, rgba(250,225,148,0.16) 82%, rgba(250,225,148,0.42) 100%);
    border-bottom: 1.5px solid rgba(250,225,148,0.75);
    box-shadow: 0 0 34px 6px rgba(250,225,148,0.2);
    animation: scanbeam 3s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes scanbeam {
    0% { transform: translateY(-90px); opacity: 0; }
    6% { opacity: 1; }
    92% { opacity: 1; }
    100% { transform: translateY(560px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .scanbeam { display: none; } .region.scanning .rbox { animation: none !important; } }

  /* ─── Region wrapper + audit box (identical system to the PDP audit) ─ */
  .region { position: relative; }
  .rbox { position: absolute; inset: -7px; border: 1.5px dashed transparent; border-radius: 7px; opacity: 0; pointer-events: none; }
  .rtag { position: absolute; top: -11px; left: 10px; font-family: var(--s-font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 3px; white-space: nowrap; display: flex; align-items: center; gap: 5px; opacity: 0; color: var(--scout-accent-on); }
  .region.scanning .rbox { opacity: 1; border-color: var(--scout-accent); box-shadow: 0 0 16px rgba(250,225,148,0.22); animation: rblink 0.85s ease-in-out infinite; }
  .region.scanning .rtag { opacity: 1; background: var(--scout-accent); }
  @keyframes rblink { 0%,100% { opacity: 1; } 50% { opacity: 0.22; } }
  .region.pass .rbox { opacity: 1; border-style: solid; border-color: var(--s-pass); box-shadow: 0 0 16px rgba(52,211,153,0.18); }
  .region.pass .rtag { opacity: 1; background: var(--s-pass); }
  .region.fail .rbox { opacity: 1; border-style: solid; border-color: var(--s-fail); box-shadow: 0 0 16px rgba(248,113,113,0.18); }
  .region.fail .rtag { opacity: 1; background: var(--s-fail); }
  .page.active .region:not(.scanning):not(.pass):not(.fail) { opacity: 0.5; transition: opacity 0.3s ease; }

  /* ─── Search results page skeleton ──────────────────────────────── */
  /* Search bar */
  .searchbar { display: flex; align-items: center; gap: 12px; height: 46px; background: var(--s-surface); border: 1px solid var(--s-border-strong); border-radius: 999px; padding: 0 8px 0 18px; }
  .sb-icon { width: 16px; height: 16px; color: var(--s-text-tertiary); flex-shrink: 0; }
  .sb-query { flex: 1; font-family: var(--s-font-mono); font-size: 13px; color: var(--s-text); }
  .sb-cursor { display: inline-block; width: 1.5px; height: 14px; background: var(--scout-accent); vertical-align: middle; margin-left: 1px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sb-btn { width: 78px; height: 34px; border-radius: 999px; background: var(--scout-accent); flex-shrink: 0; }

  /* Result meta row (furniture, not audited) */
  .search-meta { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .sm-count { height: 8px; width: 110px; background: var(--s-surface); border-radius: 2px; }
  .sm-sort { height: 22px; width: 96px; background: var(--s-surface-alt); border: 1px solid var(--s-border); border-radius: var(--s-radius-sm); }

  /* Two-column body: facets left, results right */
  .sr-cols { display: grid; grid-template-columns: 210px 1fr; gap: 26px; align-items: start; }
  .facets-col { display: flex; flex-direction: column; gap: 18px; }

  /* Facet groups (facet.present) */
  .facet-block { background: var(--s-surface-alt); border: 1px solid var(--s-border); border-radius: var(--s-radius-md); padding: 12px 12px 6px; }
  .facet-title { height: 9px; width: 64px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-bottom: 12px; }
  .facet-group { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--s-border); }
  .facet-group:first-of-type { border-top: none; }
  .fg-label { height: 7px; border-radius: 2px; background: var(--s-surface-hover); }
  .fg-caret { width: 7px; height: 7px; border-right: 1.5px solid var(--s-text-muted); border-bottom: 1.5px solid var(--s-text-muted); transform: rotate(-45deg); }

  /* Facet options (facet.depth) */
  .facet-sub { height: 8px; width: 52px; background: rgba(255,255,255,0.14); border-radius: 2px; margin-bottom: 10px; }
  .facet-opt { display: flex; align-items: center; gap: 9px; padding: 5px 0; }
  .fo-box { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--s-text-muted); flex-shrink: 0; }
  .fo-box.on { background: var(--scout-accent); border-color: var(--scout-accent); }
  .fo-label { height: 6px; border-radius: 2px; background: var(--s-surface-hover); }

  /* Results grid (search.brand_relevance) */
  .results-col { display: flex; flex-direction: column; gap: 20px; }
  .res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .res-card { display: flex; flex-direction: column; gap: 7px; }
  .rc-img { height: 92px; background: linear-gradient(135deg, var(--s-surface), var(--s-surface-alt)); border-radius: 6px; }
  .rc-l1 { height: 6px; width: 92%; background: var(--s-surface-hover); border-radius: 2px; }
  .rc-l2 { height: 6px; width: 54%; background: var(--s-surface); border-radius: 2px; }

  /* Empty / no-results state (search.empty_state) — what the page shows with zero results */
  .emptystate { background: var(--s-surface-alt); border: 1px dashed var(--s-border-strong); border-radius: var(--s-radius-md); padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 11px; }
  .es-icon { width: 30px; height: 30px; color: var(--s-text-tertiary); }
  .es-line1 { height: 9px; width: 150px; background: var(--s-surface-hover); border-radius: 2px; }
  .es-line2 { height: 7px; width: 224px; background: var(--s-surface); border-radius: 2px; }
  .es-chips { display: flex; gap: 8px; margin-top: 4px; }
  .es-chip { height: 20px; width: 60px; border-radius: 999px; background: var(--s-surface); border: 1px solid var(--s-border); }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <!-- Browser chrome -->
      <div class="chrome">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="navbtns">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
        <div class="addresspill">
          <img id="favicon" class="favicon" alt="" />
          <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span class="url" id="addr">wazu.com/search?q=trail-runner</span>
          <span class="reload"></span>
        </div>
        <div class="hud" id="hud">
          <span class="spin"></span>
          <span id="hud-text">Auditing search results…</span>
        </div>
      </div>

      <!-- Search results page being audited -->
      <div class="viewport">
        <div class="scanbeam"></div>
        <div class="page" id="page">

          <!-- search bar (furniture, not audited) -->
          <div class="searchbar">
            <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <span class="sb-query">trail runner<span class="sb-cursor"></span></span>
            <span class="sb-btn"></span>
          </div>

          <!-- result meta (furniture, not audited) -->
          <div class="search-meta">
            <div class="sm-count"></div>
            <div class="sm-sort"></div>
          </div>

          <div class="sr-cols">
            <!-- LEFT: facets -->
            <div class="facets-col">
              <!-- facet.present · which filter groups exist -->
              <div class="region" data-region="facet_present">
                <div class="facet-block">
                  <div class="facet-title"></div>
                  <div class="facet-group"><span class="fg-label" style="width:62px"></span><span class="fg-caret"></span></div>
                  <div class="facet-group"><span class="fg-label" style="width:44px"></span><span class="fg-caret"></span></div>
                  <div class="facet-group"><span class="fg-label" style="width:52px"></span><span class="fg-caret"></span></div>
                  <div class="facet-group"><span class="fg-label" style="width:40px"></span><span class="fg-caret"></span></div>
                  <div class="facet-group"><span class="fg-label" style="width:56px"></span><span class="fg-caret"></span></div>
                </div>
                <div class="rbox"><span class="rtag">Facets present</span></div>
              </div>

              <!-- facet.depth · how many options inside a facet -->
              <div class="region" data-region="facet_depth">
                <div class="facet-block">
                  <div class="facet-sub"></div>
                  <div class="facet-opt"><span class="fo-box on"></span><span class="fo-label" style="width:78px"></span></div>
                  <div class="facet-opt"><span class="fo-box"></span><span class="fo-label" style="width:58px"></span></div>
                  <div class="facet-opt"><span class="fo-box"></span><span class="fo-label" style="width:90px"></span></div>
                  <div class="facet-opt"><span class="fo-box"></span><span class="fo-label" style="width:66px"></span></div>
                </div>
                <div class="rbox"><span class="rtag">Facet depth</span></div>
              </div>
            </div>

            <!-- RIGHT: results grid + no-results state -->
            <div class="results-col">
              <div class="region" data-region="brand_relevance">
                <div class="res-grid">
                  <div class="res-card"><div class="rc-img"></div><div class="rc-l1"></div><div class="rc-l2"></div></div>
                  <div class="res-card"><div class="rc-img"></div><div class="rc-l1"></div><div class="rc-l2"></div></div>
                  <div class="res-card"><div class="rc-img"></div><div class="rc-l1"></div><div class="rc-l2"></div></div>
                  <div class="res-card"><div class="rc-img"></div><div class="rc-l1"></div><div class="rc-l2"></div></div>
                  <div class="res-card"><div class="rc-img"></div><div class="rc-l1"></div><div class="rc-l2"></div></div>
                  <div class="res-card"><div class="rc-img"></div><div class="rc-l1"></div><div class="rc-l2"></div></div>
                </div>
                <div class="rbox"><span class="rtag">Brand relevance</span></div>
              </div>

              <!-- empty_state · the "no results" screen (same box style, below results) -->
              <div class="region" data-region="empty_state">
                <div class="emptystate">
                  <svg class="es-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6"/></svg>
                  <div class="es-line1"></div>
                  <div class="es-line2"></div>
                  <div class="es-chips"><span class="es-chip"></span><span class="es-chip"></span><span class="es-chip"></span></div>
                </div>
                <div class="rbox"><span class="rtag">No Results</span></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

<script>
  // Fit the fixed 880×540 frame into the viewport
  (function () {
    const frame = document.getElementById("frame");
    function fit() {
      const pad = 0;
      const s = Math.min((innerWidth - pad) / 880, (innerHeight - pad) / 600);
      frame.style.transform = "scale(" + s + ")";
    }
    addEventListener("resize", fit); fit();
  })();

  // ════════════════════════════════════════════════════════════════════
  //  RUNTIME API  —  window.SearchAudit   (identical contract to PDPAudit)
  //  Nothing runs on a fixed timer: a region stays in its pulsing-yellow
  //  "scanning" state until YOU resolve it — hold while the backend scores,
  //  then call pass()/fail() with your own text.
  //
  //  Region ids (also at SearchAudit.regions) → metric:
  //    "empty_state"     search.empty_state     (0–100, weight 7)
  //    "brand_relevance" search.brand_relevance (0–100, weight 7)
  //    "facet_present"   facet.present          (Y/N,   weight 8)
  //    "facet_depth"     facet.depth            (0–100, weight 5)
  //
  //  SearchAudit.setUrl("acme.com/search?q=…")
  //  SearchAudit.status("Scoring brand relevance…")
  //  SearchAudit.scan("facet_present")              // → pulsing yellow (held)
  //  SearchAudit.pass("facet_present", "Yes · 5 groups")
  //  SearchAudit.fail("facet_depth", "45 / 100")
  //  SearchAudit.reset("facet_depth") / resetAll()
  //  SearchAudit.complete()                          // auto "N passed · M issues"
  //  SearchAudit.complete("Search readiness · 65 / 100")
  //  SearchAudit.beam(false)
  // ════════════════════════════════════════════════════════════════════
  const SearchAudit = (function () {
    const ICON_OK = "✓", ICON_BAD = "✕";
    const page = document.getElementById("page");
    const hud = document.getElementById("hud");
    const hudText = document.getElementById("hud-text");
    const beamEl = document.querySelector(".scanbeam");

    const NAMES = {
      empty_state: "No Results", brand_relevance: "Brand relevance",
      facet_present: "Facets present", facet_depth: "Facet depth",
    };
    const ORDER = ["facet_present", "facet_depth", "brand_relevance", "empty_state"];

    const el = (id) => page.querySelector('.region[data-region="' + id + '"]');
    const tag = (id) => { const r = el(id); return r && r.querySelector(".rtag"); };

    function spinner(on) {
      const existing = hud.querySelector(".spin");
      const dot = hud.querySelector(".done-dot");
      if (on) { if (dot) dot.remove(); if (!existing) { const s = document.createElement("span"); s.className = "spin"; hud.prepend(s); } }
      else if (existing) existing.remove();
    }

    const api = {
      regions: ORDER.slice(),
      names: NAMES,
      setUrl(url) {
        var clean = String(url).replace(/^https?:\/\//, "");
        document.getElementById("addr").textContent = clean;
        var host = clean.split("/")[0];
        var fav = document.getElementById("favicon");
        if (fav && host) {
          fav.onerror = function () { fav.style.display = "none"; };
          fav.onload = function () { fav.style.display = ""; };
          fav.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
        }
        return api;
      },
      status(text) { spinner(true); hudText.textContent = text; return api; },
      scan(id, label) {
        const r = el(id); if (!r) return api;
        r.classList.remove("pass", "fail"); r.classList.add("scanning");
        page.classList.add("active");
        tag(id).textContent = label || NAMES[id] || id;
        return api;
      },
      pass(id, text) {
        const r = el(id); if (!r) return api;
        r.classList.remove("scanning", "fail"); r.classList.add("pass");
        tag(id).textContent = ICON_OK + " " + (text || NAMES[id] || id);
        return api;
      },
      fail(id, text) {
        const r = el(id); if (!r) return api;
        r.classList.remove("scanning", "pass"); r.classList.add("fail");
        tag(id).textContent = ICON_BAD + " " + (text || NAMES[id] || id);
        return api;
      },
      reset(id) {
        const r = el(id); if (!r) return api;
        r.classList.remove("scanning", "pass", "fail");
        tag(id).textContent = NAMES[id] || id;
        return api;
      },
      resetAll() {
        ORDER.forEach((id) => api.reset(id));
        page.classList.remove("active");
        spinner(true);
        hudText.textContent = "Auditing search results…";
        return api;
      },
      complete(text) {
        page.classList.remove("active");
        spinner(false);
        if (beamEl) beamEl.style.display = "none";   // audit done → stop the sweeping beam
        if (text) { hudText.textContent = text; return api; }
        let pass = 0, fail = 0;
        ORDER.forEach((id) => { const r = el(id); if (!r) return; if (r.classList.contains("pass")) pass++; else if (r.classList.contains("fail")) fail++; });
        hudText.innerHTML = 'Audit complete · <b><span class="ok">' + pass + ' passed</span> · <span class="bad">' + fail + ' issues</span></b>';
        return api;
      },
      beam(on) { if (beamEl) beamEl.style.display = on === false ? "none" : ""; return api; },
    };
    return api;
  })();
  window.SearchAudit = SearchAudit;

  // ?url= override for quick framing in the preview.
  (function () {
    const u = new URLSearchParams(location.search).get("url");
    if (u) SearchAudit.setUrl(u);
  })();

  // ════════════════════════════════════════════════════════════════════
  //  DEMO PLAYBACK (preview only) — disable with ?demo=0.
  //  The real product calls SearchAudit.scan/pass/fail as results arrive.
  // ════════════════════════════════════════════════════════════════════
  const DEMO = [
    { id: "facet_present",   outcome: "pass", text: "Facets present · Yes" },
    { id: "facet_depth",     outcome: "fail", text: "Facet depth · 45/100" },
    { id: "brand_relevance", outcome: "pass", text: "Brand relevance · 72/100" },
    { id: "empty_state",     outcome: "fail", text: "No Results · 34/100" },
  ];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function demoRun() {
    SearchAudit.resetAll();
    if (reduce) {
      DEMO.forEach((d) => d.outcome === "pass" ? SearchAudit.pass(d.id, d.text) : SearchAudit.fail(d.id, d.text));
      SearchAudit.complete();
      return;
    }
    await sleep(700);
    for (const d of DEMO) {
      SearchAudit.status("Scoring " + (SearchAudit.names[d.id] || d.id) + "…");
      SearchAudit.scan(d.id);
      await sleep(1150);            // ← real engine: await the backend result here
      d.outcome === "pass" ? SearchAudit.pass(d.id, d.text) : SearchAudit.fail(d.id, d.text);
      await sleep(520);
    }
    SearchAudit.complete();
    await sleep(3400);
    demoRun();
  }

  if (new URLSearchParams(location.search).get("demo") !== "0") {
    demoRun();
  }
</script>
