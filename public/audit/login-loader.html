<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login loaders — mobile — GroLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet" />

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* GroLabs tokens (subset for loaders) */
  :root {
    --scout-accent: #fae194;
    --scout-accent-hover: #fcebab;
    --scout-accent-on: #131316;
    --s-bg: #131316;
    --s-bg-deeper: #0E0E11;
    --s-surface: #1c1d24;
    --s-surface-alt: #16171c;
    --s-surface-hover: #24262e;
    --s-border: rgba(255,255,255,0.08);
    --s-border-strong: rgba(255,255,255,0.16);
    --s-text: #EDEAE0;
    --s-text-strong: #FFFFFF;
    --s-text-secondary: rgba(237,234,224,0.6);
    --s-text-tertiary: rgba(237,234,224,0.4);
    --s-text-muted: rgba(237,234,224,0.28);
    --s-success: #10b981;
    --s-success-text: #34d399;
    --s-radius-sm: 6px;
    --s-radius-md: 8px;
    --s-radius-lg: 12px;
    --s-font: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    --s-font-brand: "Permanent Marker", cursive;
    --s-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--s-font); }

  /* ─── Shared loader frame ────────────────────────────────────────── */
  .loader-frame {
    width: 100%;
    height: 100%;
    background: var(--s-bg);
    color: var(--s-text);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    font-family: var(--s-font);
    overflow: hidden;
    position: relative;
  }
  .lf-header { display: flex; flex-direction: column; gap: 6px; }
  .lf-eyebrow {
    font-family: var(--s-font-mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--scout-accent);
  }
  .lf-title { font-size: 15px; font-weight: 600; color: var(--s-text-strong); }
  .lf-url { font-family: var(--s-font-mono); font-size: 11px; color: var(--s-text-tertiary); }
  .lf-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
  }

  /* ═════════════════════════════════════════════════════════════════
     Phone frame + mobile login-screen mock (shared by ML1 + ML2)
     ═════════════════════════════════════════════════════════════════ */
  .phone {
    width: 280px;
    height: 560px;
    background: #050506;
    border-radius: 42px;
    padding: 10px;
    flex-shrink: 0;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.06),
      0 30px 70px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.6);
  }
  .phone-screen {
    position: relative;
    width: 260px;
    height: 540px;
    background: var(--s-bg);
    border-radius: 32px;
    overflow: hidden;
  }
  .phone-notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 104px; height: 22px;
    background: #050506;
    border-radius: 0 0 14px 14px;
    z-index: 6;
  }
  .phone-statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-family: var(--s-font-mono);
    font-size: 10px;
    color: var(--s-text-secondary);
    z-index: 5;
  }
  .phone-statusbar .dots { display: flex; gap: 3px; align-items: center; }
  .phone-statusbar .dots i {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--s-text-tertiary);
    display: inline-block;
  }

  /* Mobile browser chrome — address bar with the URL in kinetic yellow.
     This reframes the mock as a website in a browser, not a native app. */
  .ml-browserbar {
    position: absolute;
    top: 28px; left: 0; right: 0;
    height: 36px;
    display: flex; align-items: center;
    padding: 0 10px;
    background: var(--s-bg-deeper);
    border-bottom: 1px solid var(--s-border);
    z-index: 5;
  }
  .ml-addresspill {
    flex: 1; min-width: 0;
    height: 26px;
    background: var(--s-surface);
    border: 1px solid var(--s-border);
    border-radius: 999px;
    display: flex; align-items: center; gap: 7px;
    padding: 0 10px;
  }
  .ml-bar-fav { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; object-fit: cover; }
  .ml-bar-url {
    font-family: var(--s-font-mono);
    font-size: 11px;
    color: var(--scout-accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .ml-bar-reload {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--s-text-tertiary);
    flex-shrink: 0;
  }

  /* Login mock — skeleton elements positioned in normal flow */
  .ml-screen {
    position: absolute;
    inset: 0;
    padding: 72px 26px 0;
  }
  /* Customer's own logo area — shows the real favicon once loaded, neutral skeleton until then */
  .ml-logo {
    width: 52px; height: 52px;
    margin: 12px auto 0;
    border-radius: 50%;
    background: var(--s-surface-alt);
    border: 1px solid var(--s-border);
    overflow: hidden;
  }
  .ml-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Live screenshot of the page being scanned (sits over the skeleton, under the scanline) */
  .ml-shot {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top center;
    z-index: 3;
    opacity: 0.92;
  }
  /* Favicon chip in the loader header */
  .lf-urlrow { display: flex; align-items: center; gap: 7px; }
  .lf-favicon {
    width: 14px; height: 14px;
    border-radius: 3px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--s-surface-alt);
  }
  .ml-title {
    width: 130px; height: 14px;
    margin: 22px auto 0;
    background: rgba(255,255,255,0.18);
    border-radius: 3px;
  }
  .ml-subtitle {
    width: 178px; height: 8px;
    margin: 10px auto 0;
    background: var(--s-surface-alt);
    border-radius: 2px;
  }
  .ml-field {
    margin-top: 18px;
    height: 44px;
    background: var(--s-surface-alt);
    border: 1px solid var(--s-border);
    border-radius: var(--s-radius-md);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
  }
  .ml-field .ic { width: 14px; height: 14px; border-radius: 3px; background: var(--s-text-muted); flex-shrink: 0; }
  .ml-field .ln { height: 6px; border-radius: 2px; background: rgba(255,255,255,0.10); }
  .ml-field.email .ln { width: 60%; }
  .ml-field.password .ln { width: 38%; }
  .ml-field .eye { margin-left: auto; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--s-text-muted); }
  .ml-forgot {
    height: 8px; width: 92px;
    margin: 12px 0 0 auto;
    background: rgba(250,225,148,0.32);
    border-radius: 2px;
  }
  .ml-cta {
    margin-top: 16px;
    height: 46px;
    background: var(--scout-accent);
    border-radius: var(--s-radius-md);
    display: flex; align-items: center; justify-content: center;
  }
  .ml-cta .lbl { width: 64px; height: 9px; border-radius: 2px; background: rgba(19,19,22,0.55); }
  .ml-divider {
    display: flex; align-items: center; gap: 10px;
    margin-top: 22px;
  }
  .ml-divider .rule { flex: 1; height: 1px; background: var(--s-border); }
  .ml-divider .or { width: 16px; height: 6px; border-radius: 2px; background: var(--s-text-muted); }
  .ml-social {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 18px;
  }
  .ml-social-btn {
    height: 44px;
    background: var(--s-surface);
    border: 1px solid var(--s-border);
    border-radius: var(--s-radius-md);
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
  }
  .ml-social-btn .g { width: 16px; height: 16px; border-radius: 50%; background: var(--s-surface-hover); }
  .ml-social-btn .t { width: 30px; height: 6px; border-radius: 2px; background: rgba(255,255,255,0.10); }
  .ml-signup {
    position: absolute;
    left: 0; right: 0; bottom: 30px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ml-signup .a { width: 96px; height: 7px; border-radius: 2px; background: var(--s-surface-alt); }
  .ml-signup .b { width: 48px; height: 7px; border-radius: 2px; background: rgba(250,225,148,0.32); }

  /* ─── ML1 · Scanline sweep over the login screen ──────────────────── */
  .ml-scanline {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 70px;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(250,225,148,0.0) 26%,
      rgba(250,225,148,0.14) 58%,
      rgba(250,225,148,0.4) 86%,
      var(--scout-accent) 100%
    );
    border-bottom: 1.5px solid var(--scout-accent);
    box-shadow: 0 0 28px 6px rgba(250,225,148,0.45);
    animation: ml-sweep 2.8s cubic-bezier(.45,.05,.55,.95) infinite;
    pointer-events: none;
    z-index: 4;
  }
  @keyframes ml-sweep {
    0%   { transform: translateY(-70px); opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { transform: translateY(540px); opacity: 0; }
  }

  /* ─── ML2 · Element discovery — bounding boxes over login components ─ */
  .ml-box {
    position: absolute;
    border: 1.5px dashed var(--scout-accent);
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25) inset, 0 0 12px rgba(250,225,148,0.22);
  }
  .ml-box .ml-tag {
    position: absolute;
    top: -10px; left: -1px;
    background: var(--scout-accent);
    color: var(--scout-accent-on);
    font-family: var(--s-font-mono);
    font-size: 8px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 2px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
  }
  /* Tags that sit near the bottom flip above-vs-below as needed; these read fine top-left. */
  .ml-box-brand  { left: 100px; top: 80px;  width: 60px;  height: 60px;  animation: ml-box-in 7s 0.3s infinite; }
  .ml-box-email  { left: 22px;  top: 204px; width: 216px; height: 52px;  animation: ml-box-in 7s 1.1s infinite; }
  .ml-box-pass   { left: 22px;  top: 266px; width: 216px; height: 52px;  animation: ml-box-in 7s 1.9s infinite; }
  .ml-box-forgot { left: 138px; top: 322px; width: 100px; height: 16px;  animation: ml-box-in 7s 2.7s infinite; }
  .ml-box-cta    { left: 22px;  top: 346px; width: 216px; height: 54px;  animation: ml-box-in 7s 3.5s infinite; }
  .ml-box-social { left: 22px;  top: 438px; width: 216px; height: 52px;  animation: ml-box-in 7s 4.3s infinite; }
  .ml-box-signup { left: 50px;  top: 497px; width: 160px; height: 18px;  animation: ml-box-in 7s 5.1s infinite; }
  @keyframes ml-box-in {
    0%, 3%   { opacity: 0; transform: scale(1.04); }
    7%       { opacity: 1; transform: scale(1); }
    95%      { opacity: 1; }
    100%     { opacity: 0; }
  }
  .ml-counter {
    margin-top: 14px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    justify-content: center;
  }
  .ml-counter b {
    font-family: var(--s-font-brand);
    font-size: 24px;
    color: var(--scout-accent);
    font-weight: 400;
  }
  .ml-counter span {
    font-family: var(--s-font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--s-text-tertiary);
  }

  /* ═════════════════════════════════════════════════════════════════
     ML3 — Diagnostic checklist
     ═════════════════════════════════════════════════════════════════ */
  .l2-list { width: 100%; display: flex; flex-direction: column; }
  .l2-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--s-border);
    font-size: 13px;
  }
  .l2-row:last-child { border-bottom: none; }
  .l2-icon {
    width: 18px; height: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--s-text-tertiary);
  }
  .l2-row.done .l2-icon { color: var(--s-success-text); }
  .l2-row.active .l2-icon { color: var(--scout-accent); }
  .l2-row.active .l2-spinner {
    width: 12px; height: 12px;
    border: 1.5px solid rgba(250,225,148,0.25);
    border-top-color: var(--scout-accent);
    border-radius: 50%;
    animation: l2-spin 0.9s linear infinite;
  }
  @keyframes l2-spin { to { transform: rotate(360deg); } }
  .l2-label { flex: 1; color: var(--s-text); }
  .l2-row.pending .l2-label { color: var(--s-text-tertiary); }
  .l2-row.active .l2-label { color: var(--s-text-strong); font-weight: 500; }
  .l2-row.done .l2-label { color: var(--s-text-secondary); }
  .l2-time {
    font-family: var(--s-font-mono);
    font-size: 10px;
    color: var(--s-text-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ═════════════════════════════════════════════════════════════════
     ML4 — Terminal log stream
     ═════════════════════════════════════════════════════════════════ */
  .l4-terminal {
    width: 100%; height: 100%;
    background: var(--s-bg-deeper);
    border: 1px solid var(--s-border);
    border-radius: var(--s-radius-md);
    padding: 14px 16px;
    font-family: var(--s-font-mono);
    font-size: 11px;
    line-height: 1.7;
    overflow: hidden;
    position: relative;
  }
  .l4-line { display: flex; gap: 10px; opacity: 0; animation: l4-appear 0.3s forwards; }
  .l4-line.l1 { animation-delay: 0.0s; }
  .l4-line.l2 { animation-delay: 0.4s; }
  .l4-line.l3 { animation-delay: 0.9s; }
  .l4-line.l4 { animation-delay: 1.5s; }
  .l4-line.l5 { animation-delay: 2.2s; }
  .l4-line.l6 { animation-delay: 3.0s; }
  @keyframes l4-appear { to { opacity: 1; } }
  .l4-ts { color: var(--s-text-muted); }
  .l4-tag { color: var(--scout-accent); font-weight: 500; min-width: 56px; }
  .l4-msg { color: var(--s-text); flex: 1; }
  .l4-result { color: var(--s-success-text); }
  .l4-result.running { color: var(--scout-accent); }
  .l4-cursor {
    display: inline-block;
    width: 7px; height: 12px;
    background: var(--scout-accent);
    vertical-align: middle;
    margin-left: 4px;
    animation: l4-cursor 1s steps(2) infinite;
  }
  @keyframes l4-cursor { 50% { opacity: 0; } }

  /* ═════════════════════════════════════════════════════════════════
     ML5 — Inline button loader (mobile sign-in CTA)
     ═════════════════════════════════════════════════════════════════ */
  .l9-context {
    width: 100%;
    background: var(--s-surface);
    border: 1px solid var(--s-border);
    border-radius: var(--s-radius-lg);
    padding: 18px;
  }
  .l9-context-label {
    font-family: var(--s-font-mono);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--s-text-tertiary);
    margin-bottom: 10px;
  }
  .l9-input-mock {
    width: 100%; height: 36px;
    background: var(--s-surface-alt);
    border: 1px solid var(--s-border);
    border-radius: var(--s-radius-md);
    padding: 0 12px;
    display: flex; align-items: center;
    font-family: var(--s-font-mono);
    font-size: 12px; color: var(--s-text);
    margin-bottom: 10px;
  }
  .l9-input-mock.pw { letter-spacing: 3px; color: var(--s-text-tertiary); }
  .l9-btn {
    width: 100%;
    background: var(--scout-accent);
    color: var(--scout-accent-on);
    border: none;
    padding: 11px 16px;
    border-radius: var(--s-radius-md);
    font-size: 13px; font-weight: 600;
    font-family: var(--s-font);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: progress;
    position: relative;
    overflow: hidden;
  }
  .l9-btn-spinner {
    width: 14px; height: 14px;
    border: 1.5px solid rgba(19,19,22,0.2);
    border-top-color: var(--scout-accent-on);
    border-radius: 50%;
    animation: l9-spin 0.8s linear infinite;
  }
  @keyframes l9-spin { to { transform: rotate(360deg); } }
  .l9-btn-progress {
    position: absolute;
    left: 0; bottom: 0;
    height: 2px; width: 100%;
    background: rgba(19,19,22,0.15);
  }
  .l9-btn-progress::before {
    content: "";
    position: absolute;
    height: 100%; width: 30%;
    background: var(--scout-accent-on);
    border-radius: 999px;
    animation: l9-progress 1.6s ease-in-out infinite;
  }
  @keyframes l9-progress {
    0%   { left: -30%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#131316"/>
      <rect x="38" y="24" width="24" height="52" rx="5" fill="none" stroke="#fae194" stroke-width="2.2"/>
      <line x1="38" y1="46" x2="62" y2="46" stroke="#fae194" stroke-width="1.4" stroke-dasharray="3 2"/>
      <circle cx="50" cy="35" r="3" fill="#fae194"/>
    </svg>
  </template>

  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    // The page being scanned. In production this is whatever URL the user typed —
    // pass it via ?url= (e.g. ...&url=acme.com) and the header, favicon, screenshot,
    // and terminal log all re-derive from it. Nothing here is static.
    const RAW = (new URLSearchParams(location.search).get("url") || "www.pitaconnudo.com")
      .replace(/^https?:\/\//, "");
    const HOST = RAW.split("/")[0];
    const SCAN_URL = RAW;
    const FAVICON = `https://www.google.com/s2/favicons?domain=${HOST}&sz=128`;
    const SHOT = `https://image.thum.io/get/width/720/crop/1280/noanimate/https://${HOST}/`;
    const hideOnError = (e) => { e.target.style.display = "none"; };

    function LoaderHeader({ url = SCAN_URL, showUrl = true }) {
      return (
        <div className="lf-header">
          <div className="lf-eyebrow">Scan in progress</div>
          <div className="lf-title">Analyzing login screen</div>
          {showUrl && (
            <div className="lf-urlrow">
              <img className="lf-favicon" src={FAVICON} alt="" onError={hideOnError} />
              <span className="lf-url">{url}</span>
            </div>
          )}
        </div>
      );
    }

    /* The shared mobile login mock. `shot` overlays a live screenshot of the real
       page over the skeleton; the skeleton stays underneath as a graceful fallback. */
    function PhoneLogin({ children, shot }) {
      return (
        <div className="phone">
          <div className="phone-screen">
            <div className="phone-notch"></div>
            <div className="phone-statusbar">
              <span>9:41</span>
              <span className="dots"><i></i><i></i><i></i></span>
            </div>
            <div className="ml-browserbar">
              <div className="ml-addresspill">
                <img className="ml-bar-fav" src={FAVICON} alt="" onError={hideOnError} />
                <span className="ml-bar-url">{SCAN_URL}</span>
                <span className="ml-bar-reload"></span>
              </div>
            </div>
            <div className="ml-screen">
              <div className="ml-logo"><img src={FAVICON} alt="" onError={hideOnError} /></div>
              <div className="ml-title"></div>
              <div className="ml-subtitle"></div>
              <div className="ml-field email"><span className="ic"></span><span className="ln"></span></div>
              <div className="ml-field password"><span className="ic"></span><span className="ln"></span><span className="eye"></span></div>
              <div className="ml-forgot"></div>
              <div className="ml-cta"><span className="lbl"></span></div>
              <div className="ml-divider"><span className="rule"></span><span className="or"></span><span className="rule"></span></div>
              <div className="ml-social">
                <div className="ml-social-btn"><span className="g"></span><span className="t"></span></div>
                <div className="ml-social-btn"><span className="g"></span><span className="t"></span></div>
              </div>
              <div className="ml-signup"><span className="a"></span><span className="b"></span></div>
            </div>
            {shot && <img className="ml-shot" src={SHOT} alt="" onError={hideOnError} />}
            {children}
          </div>
        </div>
      );
    }

    /* ─── ML1 · Scanline sweep ────────────────────────────────────── */
    function ML1_Scanline() {
      return (
        <div className="loader-frame">
          <LoaderHeader showUrl={false} />
          <div className="lf-stage">
            <PhoneLogin>
              <div className="ml-scanline"></div>
            </PhoneLogin>
          </div>
        </div>
      );
    }

    /* ─── ML2 · Element discovery (bounding boxes) ────────────────── */
    function ML2_Discovery() {
      return (
        <div className="loader-frame">
          <LoaderHeader showUrl={false} />
          <div className="lf-stage" style={{ flexDirection: "column", gap: 14 }}>
            <PhoneLogin>
              <div className="ml-box ml-box-brand"><span className="ml-tag">Brand</span></div>
              <div className="ml-box ml-box-email"><span className="ml-tag">Email</span></div>
              <div className="ml-box ml-box-pass"><span className="ml-tag">Password</span></div>
              <div className="ml-box ml-box-forgot"><span className="ml-tag">Forgot link</span></div>
              <div className="ml-box ml-box-cta"><span className="ml-tag">Sign-in CTA</span></div>
              <div className="ml-box ml-box-social"><span className="ml-tag">Social auth</span></div>
              <div className="ml-box ml-box-signup"><span className="ml-tag">Sign-up</span></div>
            </PhoneLogin>
            <div className="ml-counter">
              <b>7</b>
              <span>login components detected</span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── ML3 · Diagnostic checklist ──────────────────────────────── */
    function CheckIcon() {
      return (
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 8l3.5 3.5L13 5" />
        </svg>
      );
    }
    function DotIcon() {
      return (
        <svg viewBox="0 0 16 16" width="6" height="6">
          <circle cx="8" cy="8" r="3" fill="currentColor" />
        </svg>
      );
    }
    function ML3_Checklist() {
      const steps = [
        { label: "Rendering login screen", state: "done", time: "0.6s" },
        { label: "Detecting input fields", state: "done", time: "1.4s" },
        { label: "Mapping auth providers", state: "active", time: "—" },
        { label: "Checking tap-target sizes", state: "pending", time: "—" },
        { label: "Scoring sign-in friction", state: "pending", time: "—" },
      ];
      return (
        <div className="loader-frame">
          <LoaderHeader />
          <div className="lf-stage" style={{ alignItems: "stretch", justifyContent: "flex-start" }}>
            <div className="l2-list">
              {steps.map((s, i) => (
                <div key={i} className={`l2-row ${s.state}`}>
                  <div className="l2-icon">
                    {s.state === "done" ? <CheckIcon /> : s.state === "active" ? <div className="l2-spinner"></div> : <DotIcon />}
                  </div>
                  <div className="l2-label">{s.label}</div>
                  <div className="l2-time">{s.time}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ─── ML4 · Terminal log stream ───────────────────────────────── */
    function ML4_Terminal() {
      return (
        <div className="loader-frame" style={{ padding: 18 }}>
          <div className="l4-terminal">
            <div className="l4-line l1">
              <span className="l4-ts">14:02:13</span>
              <span className="l4-tag">GET</span>
              <span className="l4-msg">{SCAN_URL}</span>
              <span className="l4-result">✓ 200</span>
            </div>
            <div className="l4-line l2">
              <span className="l4-ts">14:02:14</span>
              <span className="l4-tag">PARSE</span>
              <span className="l4-msg">login form · 7 fields</span>
              <span className="l4-result">✓</span>
            </div>
            <div className="l4-line l3">
              <span className="l4-ts">14:02:14</span>
              <span className="l4-tag">DETECT</span>
              <span className="l4-msg">auth · email, google, apple</span>
              <span className="l4-result">✓</span>
            </div>
            <div className="l4-line l4">
              <span className="l4-ts">14:02:16</span>
              <span className="l4-tag">CHECK</span>
              <span className="l4-msg">tap-target sizes</span>
              <span className="l4-result running">⟳ running</span>
            </div>
            <div className="l4-line l5">
              <span className="l4-ts">14:02:17</span>
              <span className="l4-tag">EVAL</span>
              <span className="l4-msg">friction · mobile</span>
              <span className="l4-result running">⟳</span>
            </div>
            <div className="l4-line l6" style={{ color: "var(--s-text-muted)" }}>
              <span className="l4-ts">14:02:19</span>
              <span className="l4-msg">computing uplift<span className="l4-cursor"></span></span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── ML5 · Inline button loader (mobile CTA) ─────────────────── */
    function ML5_Button() {
      return (
        <div className="loader-frame" style={{ justifyContent: "center" }}>
          <div className="lf-stage" style={{ flexDirection: "column", alignItems: "stretch", justifyContent: "center" }}>
            <div className="l9-context">
              <div className="l9-context-label">Sign in</div>
              <div className="l9-input-mock">you@wazu.com</div>
              <div className="l9-input-mock pw">••••••••••</div>
              <button className="l9-btn">
                <div className="l9-btn-spinner"></div>
                <span>Analyzing…</span>
                <div className="l9-btn-progress"></div>
              </button>
              <div style={{ fontSize: 11, color: "var(--s-text-tertiary)", marginTop: 10, textAlign: "center", fontFamily: "var(--s-font-mono)" }}>
                Inspecting the sign-in flow
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Canvas ──────────────────────────────────────────────────── */
    function App() {
      return (
        <DesignCanvas
          title="Login loaders — mobile"
          subtitle="The 'analyzing your store' concept applied to a mobile login screen. Same GroLabs tokens (kinetic yellow on dark). Hover any artboard, click ⛶ to focus."
        >
          <DCSection
            id="immersive"
            title="Immersive — full phone"
            subtitle="Whole-screen states shown on-device while GroLabs scans the login flow."
          >
            <DCArtboard id="ml1" label="1 · Scanline sweep" width={360} height={720}>
              <ML1_Scanline />
            </DCArtboard>
            <DCArtboard id="ml2" label="2 · Element discovery" width={360} height={760}>
              <ML2_Discovery />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="informative"
            title="Informative — what's happening right now"
            subtitle="Tell the user exactly which step we're on. Useful for 30s+ scans."
          >
            <DCArtboard id="ml3" label="3 · Diagnostic checklist" width={360} height={420}>
              <ML3_Checklist />
            </DCArtboard>
            <DCArtboard id="ml4" label="4 · Terminal log stream" width={360} height={420}>
              <ML4_Terminal />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="minimal"
            title="Minimal — in-context"
            subtitle="Restrained state that lives right on the sign-in form."
          >
            <DCArtboard id="ml5" label="5 · Inline button loader" width={360} height={420}>
              <ML5_Button />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
