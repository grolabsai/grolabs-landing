<?xml version="1.0" encoding="UTF-8"?>
<!--
  GroLabs WP Login plugin — social-sign-in layout demo.

  Vertical rhythm, top to bottom:
    · Yellow GROLABS wordmark anchor
    · "Sign in" title
    · 3 primary provider tiles (Google, Microsoft, Apple) — each is a
      2-column layout: icon flush-left in a fixed left column, then a
      14 px gutter, then the "Continue with…" label left-aligned in
      the right column. No more centered labels.
    · Row of 5 secondary icon tiles (Facebook, Instagram, TikTok, X,
      LinkedIn) — perfectly centred on the SVG midline (cx 160).
    · "or" hairline divider — now sits BELOW the row of secondary
      icons so the two social tiers feel like one continuous block.
    · Email + password tile — same 2-column treatment as the three
      provider tiles, envelope glyph on the left, "Use email and
      password" left-aligned in the right column.

  All buttons share the same dark #1F1F23 surface + 1 px hairline
  border + gray icon glyph + bone label. No brand colours.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 640"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="A mobile login screen with three primary social sign-in buttons, a centred row of five secondary social icon buttons, an or-divider, and an email-and-password button.">
  <defs>
    <linearGradient id="screenLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
  </defs>

  <!-- Flat screen frame + hairline border -->
  <rect x="0.75" y="0.75" width="318.5" height="638.5" rx="22"
        fill="url(#screenLit)"
        stroke="rgba(237,234,224,0.22)" stroke-width="1.5"/>

  <!-- Dynamic-island camera pill -->
  <rect x="130" y="34" width="60" height="22" rx="11" fill="#000000"/>
  <circle cx="178" cy="45" r="2" fill="#1F1F23"/>

  <!-- Status bar -->
  <text x="44" y="80"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="15" font-weight="600" fill="#EDEAE0">9:41</text>
  <g transform="translate(220, 70)">
    <rect x="0"  y="6" width="3" height="4"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="5"  y="4" width="3" height="6"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="10" y="2" width="3" height="8"  rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <rect x="15" y="0" width="3" height="10" rx="0.5" fill="rgba(237,234,224,0.9)"/>
    <g transform="translate(24, 0)">
      <path d="M 0 8 Q 7 0 14 8" fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 3 9 Q 7 5 11 9" fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="7" cy="10" r="1" fill="rgba(237,234,224,0.9)"/>
    </g>
    <g transform="translate(46, 1)">
      <rect x="0" y="0" width="24" height="11" rx="2.5" fill="none" stroke="rgba(237,234,224,0.9)" stroke-width="1"/>
      <rect x="25" y="3.5" width="2" height="4" rx="0.5" fill="rgba(237,234,224,0.9)"/>
      <rect x="2"  y="2"   width="18" height="7" rx="1"  fill="rgba(237,234,224,0.9)"/>
    </g>
  </g>

  <!-- Yellow wordmark + title (no subtitle) -->
  <image x="80" y="100" width="160" height="38"
         href="grolabs-wordmark-yellow.png"
         preserveAspectRatio="xMidYMid meet"/>
  <text x="160" y="176"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#EDEAE0" text-anchor="middle">Sign in</text>

  <!-- ── Primary providers — 3 stacked tiles, two-column internal layout ── -->

  <!-- Google -->
  <g transform="translate(24, 200)">
    <rect width="272" height="44" rx="8"
          fill="#1F1F23"
          stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
    <!-- Icon column (left, vertically centred) -->
    <g transform="translate(16, 13)"
       fill="none" stroke="#EDEAE0" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 9 0 A 9 9 0 1 0 18 9 L 10 9"/>
    </g>
    <!-- Text column (right, left-aligned) -->
    <text x="52" y="28"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="14" font-weight="500" fill="#EDEAE0">Continue with Google</text>
  </g>

  <!-- Microsoft -->
  <g transform="translate(24, 252)">
    <rect width="272" height="44" rx="8"
          fill="#1F1F23"
          stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
    <g transform="translate(16, 13)" fill="#EDEAE0">
      <rect x="0" y="0" width="8" height="8" rx="1"/>
      <rect x="10" y="0" width="8" height="8" rx="1"/>
      <rect x="0" y="10" width="8" height="8" rx="1"/>
      <rect x="10" y="10" width="8" height="8" rx="1"/>
    </g>
    <text x="52" y="28"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="14" font-weight="500" fill="#EDEAE0">Continue with Microsoft</text>
  </g>

  <!-- Apple -->
  <g transform="translate(24, 304)">
    <rect width="272" height="44" rx="8"
          fill="#1F1F23"
          stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
    <g transform="translate(16, 13)" fill="#EDEAE0">
      <path d="M 12.4 1.1 c 0 0.85 -0.35 1.66 -0.92 2.25 c -0.62 0.64 -1.62 1.12 -2.45 1.05 c -0.1 -0.82 0.32 -1.66 0.88 -2.25 c 0.63 -0.67 1.7 -1.16 2.49 -1.05 z M 15.5 12.5 c -0.4 0.96 -0.6 1.39 -1.14 2.22 c -0.75 1.18 -1.81 2.64 -3.13 2.66 c -1.16 0.01 -1.46 -0.75 -3.05 -0.74 c -1.58 0.01 -1.91 0.76 -3.07 0.74 c -1.31 -0.02 -2.32 -1.35 -3.07 -2.53 c -2.1 -3.3 -1.58 -8.08 0.47 -10.17 c 1.13 -1.13 2.55 -1.79 3.89 -1.79 c 1.37 0 2.24 0.74 3.37 0.74 c 1.1 0 1.77 -0.74 3.35 -0.74 c 1.2 0 2.47 0.65 3.37 1.78 c -2.97 1.62 -2.49 5.87 1.06 7.47 z"/>
    </g>
    <text x="52" y="28"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="14" font-weight="500" fill="#EDEAE0">Continue with Apple</text>
  </g>

  <!--
    ── Secondary providers — 5 circular icon tiles, centred ──
    Geometry: 5 × 40 px circles = 200 px of icon mass, distributed
    across the 320 px viewBox as 20 px outer margins + 20 px inner gaps.
    Centres land at x = 40 / 100 / 160 / 220 / 280 — the middle icon
    sits exactly on the SVG horizontal midline.
  -->
  <g transform="translate(20, 376)">
    <!-- Facebook -->
    <g>
      <circle cx="20" cy="20" r="20"
              fill="#1F1F23"
              stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
      <text x="20" y="29"
            font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
            font-size="22" font-weight="900" fill="#EDEAE0" text-anchor="middle">f</text>
    </g>

    <!-- Instagram (outlined camera) -->
    <g transform="translate(60, 0)">
      <circle cx="20" cy="20" r="20"
              fill="#1F1F23"
              stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="20" height="20" rx="6"
              fill="none" stroke="#EDEAE0" stroke-width="1.8"/>
        <circle cx="10" cy="10" r="4"
                fill="none" stroke="#EDEAE0" stroke-width="1.8"/>
        <circle cx="15" cy="5" r="1" fill="#EDEAE0"/>
      </g>
    </g>

    <!-- TikTok (musical-note glyph) -->
    <g transform="translate(120, 0)">
      <circle cx="20" cy="20" r="20"
              fill="#1F1F23"
              stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
      <g transform="translate(12, 8)">
        <path d="M 12 0 v 10 c 1.5 1.2 3.4 1.7 5 1.6 v 3 c -1.6 0 -3.4 -0.4 -5 -1.3 v 5 c 0 2.4 -1.9 4.3 -4.3 4.3 s -4.3 -1.9 -4.3 -4.3 s 1.9 -4.3 4.3 -4.3 c 0.3 0 0.6 0 0.9 0.1 v 3 c -0.3 -0.1 -0.6 -0.1 -0.9 -0.1 c -0.8 0 -1.5 0.6 -1.5 1.4 s 0.7 1.4 1.5 1.4 s 1.5 -0.6 1.5 -1.4 v -18.4 z"
              fill="#EDEAE0"/>
      </g>
    </g>

    <!-- X -->
    <g transform="translate(180, 0)">
      <circle cx="20" cy="20" r="20"
              fill="#1F1F23"
              stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
      <g transform="translate(11, 11)" stroke="#EDEAE0" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="0" x2="18" y2="18"/>
        <line x1="18" y1="0" x2="0" y2="18"/>
      </g>
    </g>

    <!-- LinkedIn -->
    <g transform="translate(240, 0)">
      <circle cx="20" cy="20" r="20"
              fill="#1F1F23"
              stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
      <text x="20" y="27"
            font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
            font-size="13" font-weight="800" fill="#EDEAE0" text-anchor="middle">in</text>
    </g>
  </g>

  <!-- "or" divider — sits below the row of 5 round buttons -->
  <line x1="40"  y1="445" x2="135" y2="445" stroke="rgba(237,234,224,0.12)" stroke-width="1"/>
  <text x="160" y="449"
        font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="11" fill="rgba(237,234,224,0.45)" text-anchor="middle">or</text>
  <line x1="185" y1="445" x2="280" y2="445" stroke="rgba(237,234,224,0.12)" stroke-width="1"/>

  <!-- ── Email + password tile — same recipe as the three providers ── -->
  <g transform="translate(24, 470)">
    <rect width="272" height="44" rx="8"
          fill="#1F1F23"
          stroke="rgba(237,234,224,0.10)" stroke-width="1"/>
    <!-- Envelope icon -->
    <g transform="translate(16, 14)"
       fill="none" stroke="#EDEAE0" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="18" height="14" rx="2"/>
      <path d="M 0 2 L 9 9 L 18 2"/>
    </g>
    <text x="52" y="28"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="14" font-weight="500" fill="#EDEAE0">Use email and password</text>
  </g>

  <!-- Home indicator -->
  <rect x="125" y="600" width="70" height="5" rx="2.5" fill="rgba(237,234,224,0.45)"/>
</svg>
