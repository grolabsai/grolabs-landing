<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GroLabs">
  <!-- Black disc background. -->
  <circle cx="32" cy="32" r="32" fill="#000000"/>

  <!-- Marker-style G drawn as a stroke path. The Permanent Marker font
       can't be reliably loaded from inside an SVG favicon (no Google
       Fonts at render time), so the glyph is hand-authored: chunky
       rounded strokes + a slight -3deg tilt + an over-shooting tail
       on the horizontal arm to mimic the hand-drawn marker feel.
       Fill stroke uses the GroLabs bone tone (#EDEAE0), the same value
       the site renders for text-white. -->
  <g transform="translate(32 32) rotate(-3) translate(-32 -32)">
    <path
      d="M 45 22
         C 41 16 27 15 21 21
         C 14 27 14 37 21 43
         C 27 49 41 48 45 42
         L 45 33
         L 33 33"
      fill="none"
      stroke="#EDEAE0"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
