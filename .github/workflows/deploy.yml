name: Deploy to GitHub Pages

# Auto-deploy on push to main is DISABLED because Vercel is now the
# canonical deploy target for this site. The workflow is kept in source
# (with workflow_dispatch only) so it can be re-triggered manually from
# the Actions tab if Vercel ever needs a fallback. To bring back
# automatic deploys, restore the `push: branches: [main]` block below.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v4
        env:
          GITHUB_PAGES: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
